name: Build applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - shell: powershell
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KindleCapture-Windows
          path: dist/KindleCapture-Windows.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: chmod +x build_macos.command
      - run: ./build_macos.command
      - uses: actions/upload-artifact@v4
        with:
          name: KindleCapture-macOS-${{ matrix.architecture }}
          path: dist/KindleCapture-macOS-${{ matrix.architecture }}.zip
